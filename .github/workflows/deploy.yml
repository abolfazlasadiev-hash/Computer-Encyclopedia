name: Build and deploy Computer Encyclopedia

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the encyclopedia
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Markdown content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-content
          cp -a "01-University courses" "03-Development-journey" .build-content/

      - name: Build Quartz on GitHub
        uses: konstfish/quartz-build-action@v7
        with:
          source: .build-content
          destination: _site
          quartz_config: .github/quartz/quartz.config.ts
          quartz_layout: .github/quartz/quartz.layout.ts
          quartz_custom_css: .github/quartz/custom.scss

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
