name: Build and deploy Computer Encyclopedia

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the encyclopedia
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare Markdown content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-content
          cp -a "01-University courses" "03-Development-journey" .build-content/
          cat > .build-content/index.md <<'EOF'
          ---
          title: Computer Encyclopedia
          description: Explore a connected knowledge base for computer science, networking, Linux, software development, and technology.
          ---
          <div class="ce-home-hero">

          <p class="ce-home-eyebrow">A PERSONAL KNOWLEDGE LIBRARY</p>

          # Computer Encyclopedia

          <p class="ce-home-lead">Understand the technology that shapes our world.</p>

          A growing, interconnected encyclopedia of computer science, systems, networking, and the tools behind modern technology.

          </div>

          ## Explore the encyclopedia

          <div class="ce-home-grid">

          <a class="ce-home-card" href="01-University-courses/Network/Network-Academy/00-Home">
          <span class="ce-home-card-kicker">01 · LEARN</span>
          <strong>University courses</strong>
          <span>Study notes, core concepts, networking, and structured learning resources.</span>
          <span class="ce-home-card-link">Explore courses →</span>
          </a>

          <a class="ce-home-card" href="03-Development-journey/04-Tools/Linux/01MyDebian/Folder">
          <span class="ce-home-card-kicker">02 · BUILD</span>
          <strong>Development journey</strong>
          <span>Practical tools, Linux workflows, experiments, and technical projects.</span>
          <span class="ce-home-card-link">Explore the journey →</span>
          </a>

          </div>

          ## Make the most of this library

          - **Search:** Find a concept or topic using the search panel.
          - **Browse:** Navigate the folder explorer to discover related subjects.
          - **Connect:** Open the graph to see how ideas and notes relate to each other.

          > This encyclopedia grows with every note. Follow links between concepts, explore unfamiliar topics, and build your own understanding.

          EOF

      - name: Build Quartz on GitHub
        uses: konstfish/quartz-build-action@v7
        with:
          source: .build-content
          destination: _site
          quartz_config: .github/quartz/quartz.config.ts
          quartz_layout: .github/quartz/quartz.layout.ts
          quartz_custom_css: .github/quartz/custom.scss

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
