name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      - name: Install dependencies
        working-directory: quartz
        run: npm ci

      - name: Copy Quartz config
        run: cp quartz.config.yaml quartz/quartz.config.yaml

      - name: Apply custom styles
        run: cp styles/custom.scss quartz/quartz/styles/custom.scss

      - name: Build Quartz
        working-directory: quartz
        run: npx quartz build -d ../content

      - name: Copy static content files
        run: |
          find content -type f ! -name '*.md' -print0 |
            while IFS= read -r -d '' file; do
              target="quartz/public/${file#content/}"
              mkdir -p "$(dirname "$target")"
              cp "$file" "$target"
            done

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: quartz/public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
