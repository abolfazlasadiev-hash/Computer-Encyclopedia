name: Build and deploy Computer Encyclopedia

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the encyclopedia
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare Markdown content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build-content
          cp -a "01-University courses" "03-Development-journey" .build-content/

          cat > .build-content/index.md <<'EOF'
          ---
          title: Computer Encyclopedia
          description: A structured technical knowledge base for computer science, networking, Linux, and software development.
          ---

          # Computer Encyclopedia

          <p class="ce-home-intro">A practical, interconnected reference for computer science, systems, networking, and software development.</p>

          ## Browse the knowledge base

          <div class="ce-home-links">
          <a class="ce-home-link" href="01-University-courses/Network/Network-Academy/00-Home">
          <strong>University courses</strong>
          <span>Course notes, fundamental concepts, and networking study materials.</span>
          </a>
          <a class="ce-home-link" href="03-Development-journey/04-Tools/Linux/01MyDebian/Folder">
          <strong>Development journey</strong>
          <span>Linux, developer tools, practical workflows, and experiments.</span>
          </a>
          </div>

          ## Reference tools

          - [[Learning Paths|Learning paths]] — suggested sequences for studying technical topics.
          - [[Glossary|Glossary]] — concise definitions of common computing terms.

          ## How to use this site

          Use the search field to find a topic, browse the folder explorer to discover notes, and follow links inside articles to explore connected concepts.
          EOF

          cat > .build-content/Glossary.md <<'EOF'
          ---
          title: Glossary
          description: A growing glossary of computer science and information technology terms.
          ---

          # Glossary

          This glossary is a central index for technical terms used throughout the encyclopedia. Definitions can be expanded as the related notes grow.

          ## A–C

          - **Algorithm:** A finite sequence of well-defined steps used to solve a problem.
          - **API (Application Programming Interface):** A defined way for software components to communicate.
          - **CPU (Central Processing Unit):** The processor that executes instructions in a computer.
          - **Cache:** A small, fast storage layer that keeps frequently used data close to where it is needed.
          - **CLI (Command-Line Interface):** A text-based interface for operating software.

          ## D–H

          - **DNS (Domain Name System):** A distributed system that translates domain names into IP addresses and other records.
          - **File system:** The structures and rules an operating system uses to organize and access stored data.
          - **HTTP (Hypertext Transfer Protocol):** An application-layer protocol used to transfer web resources.
          - **Kernel:** The core part of an operating system that manages hardware and system resources.

          ## I–M

          - **IP address:** A logical address used to identify an interface on an IP network.
          - **Linux:** A family of operating systems built around the Linux kernel.
          - **Memory:** Storage used to hold data and instructions while a system is operating.

          ## N–S

          - **Network:** A group of connected devices that exchange data.
          - **Operating system:** System software that manages hardware and provides services to applications.
          - **Protocol:** A set of rules that define communication between systems.
          - **Repository:** A storage location for project files and their version history.

          ## T–Z

          - **TCP (Transmission Control Protocol):** A transport protocol that provides reliable, ordered delivery of data.
          - **URL (Uniform Resource Locator):** An address that identifies a resource and how to access it.
          - **Virtualization:** The creation of virtual computing resources, such as virtual machines.
          EOF

          cat > ".build-content/Learning Paths.md" <<'EOF'
          ---
          title: Learning Paths
          description: Suggested study sequences through the Computer Encyclopedia.
          ---

          # Learning Paths

          These paths organize existing and future notes into practical learning sequences. Follow the suggested order, and use the links within each note to explore related concepts.

          ## Computer science foundations

          1. Start with basic computer concepts and terminology.
          2. Study data representation, operating systems, and computer architecture.
          3. Continue with algorithms, programming, and software design.

          ## Computer networking

          1. Review network fundamentals and common terminology.
          2. Study network models, addressing, and subnetting.
          3. Continue with routing, switching, transport protocols, and network services.
          4. Use the [[01-University courses/Network/Network-Academy/00-Home|Network Academy notes]] as the course entry point.

          ## Linux and system administration

          1. Learn the Linux filesystem and command-line basics.
          2. Practice users, permissions, processes, and package management.
          3. Continue with networking, services, shell scripting, and troubleshooting.
          4. Explore the [[03-Development-journey/04-Tools/Linux/01MyDebian/Folder|Linux and Debian notes]].

          ## Software development

          1. Learn programming fundamentals and version control.
          2. Practice command-line tools and development environments.
          3. Study testing, debugging, automation, and deployment.

          ## Improving these paths

          As the encyclopedia expands, add links to specific notes under each step. Keep each path focused, ordered, and suitable for a learner progressing from fundamentals to practical work.
          EOF

      - name: Build Quartz on GitHub
        uses: konstfish/quartz-build-action@v7
        with:
          source: .build-content
          destination: _site
          quartz_config: .github/quartz/quartz.config.ts
          quartz_layout: .github/quartz/quartz.layout.ts
          quartz_custom_css: .github/quartz/custom.scss

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
